services:
  mysql:
    image: mysql:8.0.45
    command:
      - --local-infile=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=2G
      # Banco analítico local, sem replicação: dispensa o log binário e
      # aumenta o redo log para acelerar a carga em lote
      - --skip-log-bin
      - --innodb-redo-log-capacity=2G
      - --innodb-flush-log-at-trx-commit=2
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      # O DDL roda automaticamente na primeira subida do banco
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
    volumes:
      - .:/app
      - ${DATA_DIR_HOST:-./data}:/data
    ports:
      - "8888:8888"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
